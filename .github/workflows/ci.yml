name: Swari Enterprise CI / CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-validate:
    name: Code Quality & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

  unit-and-integration-tests:
    name: Test Matrix (Unit, Smoke, Security, Integration)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: swari_user
          POSTGRES_PASSWORD: swari_test_password
          POSTGRES_DB: swari_carpool
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Frontend Assets
        run: npm run build

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgres://swari_user:swari_test_password@localhost:5432/swari_carpool
        run: npm run db:migrate

      - name: Run Vitest Unit Tests
        run: npx vitest run test/unit

      - name: Start Background Server for API Tests
        env:
          PORT: 8000
          NODE_ENV: test
          JWT_SECRET: ci_test_jwt_secret_must_be_32_characters_minimum
          DATABASE_URL: postgres://swari_user:swari_test_password@localhost:5432/swari_carpool
        run: |
          node server/index.js &
          sleep 3

      - name: Run Enterprise Smoke Tests
        run: npm run test:smoke

      - name: Run Multi-Client Socket Sync Tests
        run: npm run test:sync

      - name: Run Authentication & Role Tests
        run: npm run test:auth

      - name: Run Real-Time at Scale Tests
        run: npm run test:scale

      - name: Run Security & Privacy Tests
        run: npm run test:security

      - name: Run Frontend Hardening Tests
        run: npm run test:frontend

      - name: Run Supertest Integration Tests
        run: npx vitest run test/integration

  frontend-build:
    name: Production Assets Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Vite Production Assets
        run: npm run build

      - name: Verify Dist Artifacts
        run: |
          test -f dist/index.html || exit 1
          test -d dist/assets || exit 1

  docker-build:
    name: Docker Containerization Build
    runs-on: ubuntu-latest
    needs: [lint-and-validate, unit-and-integration-tests, frontend-build]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: swari/platform:latest
