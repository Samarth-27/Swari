# =================================================================
# Swari (सवारी) Production Reverse Proxy Configuration
# Features: WebSocket Upgrade, Sticky Upstream Sessions, Rate Limiting
# =================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Rate Limiting Zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

    # Upstream with Sticky Sessions (IP Hash for WebSocket stickiness)
    upstream swari_app_cluster {
        ip_hash;
        server swari-app:8000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name localhost _;

        client_max_body_size 10M;

        # Standard Proxy Headers
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $http_x_request_id;

        # 1. Real-Time WebSockets Gateway (Socket.IO)
        location /socket.io/ {
            proxy_pass http://swari_app_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;

            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
        }

        # 2. Prometheus Metrics (Internal Monitoring Only)
        location /metrics {
            proxy_pass http://swari_app_cluster/metrics;
            proxy_set_header Host $host;
        }

        # 3. Health & Readiness Probes
        location /health {
            proxy_pass http://swari_app_cluster/health;
            access_log off;
        }

        location /ready {
            proxy_pass http://swari_app_cluster/ready;
            access_log off;
        }

        # 4. Authentication API (Strict Rate Limiting)
        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://swari_app_cluster;
        }

        # 5. Core API Subsystems
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://swari_app_cluster;
        }

        # 6. Static Assets with Long Cache Expiry
        location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico|webp)$ {
            proxy_pass http://swari_app_cluster;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        # 7. Default SPA Routing
        location / {
            proxy_pass http://swari_app_cluster;
        }
    }
}
