version: '3.8'

services:
  # 1. Swari Core Application Server (Express 5 + Socket.IO + Vite Assets)
  swari-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: swari-app
    restart: unless-stopped
    user: "node"
    environment:
      - NODE_ENV=production
      - PORT=8000
      - HOST=0.0.0.0
      - CORS_ORIGIN=*
      - LOG_LEVEL=info
      - DATABASE_URL=postgresql://swari_admin:swari_secure_password_2026@swari-db:5432/swari_production
      - REDIS_URL=redis://swari-redis:6379
      - JWT_SECRET=placeholder_jwt_secret_min_32_characters_swari_prod
      - JWT_REFRESH_SECRET=placeholder_jwt_refresh_secret_min_32_chars_swari
      - JWT_EXPIRES_IN=15m
      - JWT_REFRESH_EXPIRES_IN=7d
    ports:
      - "8000:8000"
    depends_on:
      swari-db:
        condition: service_healthy
      swari-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 2. PostgreSQL 16 Relational Database with Spatial Indexing
  swari-db:
    image: postgres:16-alpine
    container_name: swari-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: swari_admin
      POSTGRES_PASSWORD: swari_secure_password_2026
      POSTGRES_DB: swari_production
    ports:
      - "5432:5432"
    volumes:
      - swari-db-data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swari_admin -d swari_production"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Redis 7 Telemetry Cache & Socket.IO Cluster Adapter
  swari-redis:
    image: redis:7-alpine
    container_name: swari-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - swari-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 4. NGINX Reverse Proxy & WebSocket Gateway
  swari-nginx:
    image: nginx:alpine
    container_name: swari-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - swari-app

volumes:
  swari-db-data:
    name: swari-db-volume
  swari-redis-data:
    name: swari-redis-volume
